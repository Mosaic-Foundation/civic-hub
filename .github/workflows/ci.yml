name: CI

# Typecheck + unit tests on every push and PR. This is the safety net the
# repo lacked: pushing to main auto-deploys to Vercel, and the backend is
# bundled by esbuild (no tsc) on deploy — so without this, a backend type
# error ships to production silently. CI does not gate the Vercel deploy
# (that's independent); it surfaces breakage fast.

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit (the tag is in the comment); bump them together.
# The Supabase CLI and npm are pinned by version: npm 12 is what Vercel's
# Node 24 image runs, and its `npm ci` refuses a lockfile npm 11 wrote.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: npm 12
        run: npm install -g npm@12.2.0

      # --- Backend: install, typecheck (tsc), run infra-free unit tests ---
      # `npm ci`, as Vercel runs it: the lockfile is the install, exactly.
      # (Until 2026-10 this was `npm install`, because a lockfile written by
      # npm 11 on a Mac failed `npm ci` on Linux; lockfiles are written with
      # npm 12 since 2026-09-03.)
      - name: Backend install
        run: npm ci --include=dev
      - name: Backend typecheck
        run: npm run build
      # tests/, scripts/ and api/ too (tsconfig.check.json): vitest runs the
      # tests without type-checking them, and api/ is bundled on deploy.
      - name: Typecheck tests, scripts, api
        run: npm run typecheck
      # High and critical advisories fail the build, in the backend and the
      # UI alike (.npmrc's audit=false only skips the install-time request).
      - name: Backend audit
        run: npm audit --audit-level=high
      # No string in src/ or ui/src/ may name a place: a place name is a hub's
      # data (its hubs row or hub_settings), never code. Comments are exempt;
      # anything else needs an entry with a reason in
      # scripts/place-name-allowlist.txt. Its own step, ahead of the tests, so
      # the failure says what it is. Added 2026-09-24 (multi-tenant Phase 4).
      - name: Place-name check
        run: npx tsx scripts/check-place-names.ts
      # Only src/db/, src/control/, scripts/ and tests/ may import the raw,
      # service-role database client, and each such file says why with a
      # `@civic-raw-client-importer:` tag (eslint.config.js). Everything else
      # reaches data through forHub(). Added 2026-09-24 (multi-tenant 2b).
      - name: Lint (raw-client rule)
        run: npm run lint
      - name: Backend unit tests
        # tests/unit only — tests/api and tests/e2e need a live Supabase/dev
        # server and are not runnable in CI. `npm test` would run everything.
        run: npx vitest run tests/unit
      # Every "?" in the admin panel links to an anchor the docs site
      # publishes: its list at https://docs.civic.social/help-anchors.json,
      # written by the docs build. A key not marked `pending` whose anchor is
      # gone fails here; pending keys the docs now cover are listed.
      # src/shared/helpRegistry.ts says how the three stay in step. Added
      # 2026-10-13 (admin menu slice).
      - name: Help links reach the docs
        run: npx tsx scripts/check-help-anchors.ts

      # --- UI: install, lint, real typecheck + build (tsc -b && vite build) ---
      - name: UI install
        run: npm ci --include=dev
        working-directory: ui
      - name: UI audit
        run: npm audit --audit-level=high
        working-directory: ui
      # Includes the import boundaries: the hub app may not import the console
      # or the start page (ui/eslint.config.js).
      - name: UI lint
        run: npm run lint
        working-directory: ui
      # Component tests (ui/src/**/*.test.tsx, jsdom): the data hook, the
      # modal, the token store, beside the code they test.
      - name: UI component tests
        run: npm test
        working-directory: ui
      - name: UI build
        run: npm run build
        working-directory: ui

  # --- API integration tests against a real Supabase stack -----------------
  #
  # Added 2026-09-22. This layer existed since 2026-08 but had never run on
  # push: CI had no database, and a bare postgres container cannot stand in,
  # because the app talks exclusively through PostgREST. The Supabase CLI
  # brings up Postgres AND PostgREST and applies supabase/migrations from
  # empty, so this job also proves, on every push, that the migration set
  # builds a working schema from scratch — which was true by luck rather than
  # by check until the missing GRANTs were found this way.
  #
  # Separate job, not appended to the one above: it pulls container images and
  # takes minutes rather than seconds, and a failure here means something
  # different from a type error. The unit job stays the fast signal.
  #
  # Every step runs at the repository root. This workflow belongs to the
  # civic-hub repository, whose root IS civic-hub/ — until 2026-09-24 each
  # step said `working-directory: civic-hub`, the path as seen from the
  # monorepo, and the job failed in seconds on every push without ever
  # reaching a test.
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: npm 12
        run: npm install -g npm@12.2.0

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.110.0

      # Applies every migration, then supabase/seed.sql, which is where the
      # second hub (athens) comes from. The API tests assert that two
      # hostnames resolve to two different hubs, so the seed is not optional.
      - name: Start Supabase
        run: supabase start

      - name: Install
        run: npm ci --include=dev

      # The keys below are the Supabase CLI's fixed local development keys.
      # They are public, identical on every machine, and reach nothing but the
      # container started above. No secret belongs in this job.
      - name: Seed hub settings
        run: |
          npx tsx scripts/seed-hub-settings.ts --hub floyd
          npx tsx scripts/seed-hub-settings.ts --hub athens
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SERVICE_ROLE_KEY }}
          # Athens's admin is derived from this by plus-addressing
          # (admin+athens@example.test), which is the address the login
          # hardening tests sign in as. Must match the hub step below.
          CIVIC_ADMIN_EMAILS: admin@example.test

      # The jurisdiction reference list (config/jurisdictions/us-jurisdictions.csv,
      # checksum-checked), loaded as the database owner the way every install
      # loads it. tests/api/hubKinds.test.ts and sampleSeed.test.ts use real rows.
      - name: Load the jurisdiction list
        run: node --import tsx scripts/load-jurisdictions.ts
        env:
          CIVIC_TARGET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # The minted-token server (below) signs hub tokens with the stack's JWT
      # secret and sends its publishable key. Both are the CLI's fixed, public,
      # local-only values; read from the stack rather than copied here so a CLI
      # that changes them does not silently break the second pass.
      - name: Local stack keys for minted hub tokens
        run: |
          supabase status -o json 2>/dev/null > /tmp/supabase-status.json
          echo "LOCAL_JWT_SECRET=$(jq -r .JWT_SECRET /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "LOCAL_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY /tmp/supabase-status.json)" >> "$GITHUB_ENV"

      # Two servers on one database. :3000 runs hub queries as the service
      # role (CIVIC_HUB_MINTED_TOKEN off, today's default); :3001 runs them as
      # `authenticated` with a minted hub token (multi-tenant Phase 3), so the
      # forced RLS policies are live. The whole API layer runs against each,
      # the leak harness and the RLS catalog test included.
      - name: Start the hub (service role, and minted hub tokens)
        run: |
          PORT=3000 BASE_URL=http://localhost:3000 \
            node --import tsx src/index.ts > /tmp/hub.log 2>&1 &
          PORT=3001 BASE_URL=http://localhost:3001 CIVIC_HUB_MINTED_TOKEN=true \
            node --import tsx src/index.ts > /tmp/hub-token.log 2>&1 &
          for port in 3000 3001; do
            ok=""
            for i in $(seq 1 30); do
              curl -sf http://localhost:$port/health >/dev/null && ok=1 && break
              sleep 1
            done
            if [ -z "$ok" ]; then
              echo "hub on :$port did not become healthy:"; cat /tmp/hub.log /tmp/hub-token.log; exit 1
            fi
          done
          # The second server must really be using hub tokens, and PostgREST
          # must accept them: /health reports both.
          curl -s -H "Host: floyd.civic.social" http://localhost:3001/health | tee /dev/stderr \
            | jq -e '.hub_db.mode == "hub_token" and .hub_db.ok == true' >/dev/null
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SERVICE_ROLE_KEY }}
          CIVIC_HUB_SIGNING_KEY: ${{ env.LOCAL_JWT_SECRET }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.LOCAL_PUBLISHABLE_KEY }}
          NODE_ENV: development
          CIVIC_ALLOW_SEED: "true"
          CIVIC_ADMIN_EMAILS: admin@example.test
          # Bare localhost resolves to the DEMO hub. Floyd is seeded in beta,
          # mirroring production, so a test cannot sign in there without being
          # on the allowlist. Athens is the demo, which is where a test signs
          # in; the tests that care about Floyd set the Host header.
          CIVIC_DEV_HUB: athens
          # Production's value until the release-1 cleanup. Set here so
          # tests/api/hubKinds.test.ts proves a second hub's new process carries
          # its OWN code, not this deployment-wide one.
          CIVIC_JURISDICTION: us-va-floyd
          # The super admin (src/control/), on its own hostname, with its one
          # operator. tests/api/control.test.ts talks to it with Host set.
          CIVIC_CONSOLE_HOSTNAME: console.localhost
          CIVIC_CONSOLE_ADMIN_EMAIL: operator@example.test
          # The start page (session 4b): tests/api/startPage.test.ts.
          CIVIC_START_HOSTNAME: start.localhost
          CIVIC_ANON_SECRET: ci-only-anon-secret
          CRON_SECRET: ci-only-cron-secret
          # The leak harness walks /unsubscribe/digest with a real token for a
          # Floyd resident; it signs with the same value (CIVIC_TEST_DIGEST_SECRET).
          DIGEST_UNSUBSCRIBE_SECRET: ci-only-digest-unsubscribe-secret
          # Every outside service is its in-memory fake (ADR-012): the AI,
          # mail, video, errors and heartbeat adapters, Polis (the conformance
          # suite walks conversations against src/debug/fakePolis.ts and makes
          # it down, slow or erroring) and the Code of Conduct check's fixed
          # rule (src/debug/fakeCodeOfConduct.ts). Storage stays the local
          # stack's (uploadHubPrefix.test.ts reads it back).
          CIVIC_FAKE_ADAPTERS: "on"
          # The console's Dashboard reads hubs' /health from this server, and
          # a hub whose slug contains "slow" never answers (tests/api/dashboard.test.ts).
          CIVIC_DASHBOARD_FAKE: "on"

      - name: API tests (service role)
        run: npx vitest run tests/api
        env:
          CIVIC_API_BASE: http://localhost:3000
          CIVIC_EXPECT_HUB_DB_MODE: service_role
          # The other instance on the same stack: tests/api/settingsVersion.test.ts
          # saves on one server and reads on the other.
          CIVIC_OTHER_API_BASE: http://localhost:3001
          CIVIC_TEST_DIGEST_SECRET: ci-only-digest-unsubscribe-secret

      # The same layer with forced RLS live: every hub query runs as
      # `authenticated` under a minted token. Includes the leak harness
      # (tests/api/leakHarness*.test.ts) and the RLS catalog test
      # (tests/api/rlsCatalog.test.ts), which also ran in the pass above.
      - name: API tests (minted hub tokens)
        if: success() || failure()
        run: npx vitest run tests/api
        env:
          CIVIC_API_BASE: http://localhost:3001
          CIVIC_EXPECT_HUB_DB_MODE: hub_token
          CIVIC_OTHER_API_BASE: http://localhost:3000
          CIVIC_TEST_DIGEST_SECRET: ci-only-digest-unsubscribe-secret
          CIVIC_HUB_SIGNING_KEY: ${{ env.LOCAL_JWT_SECRET }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.LOCAL_PUBLISHABLE_KEY }}

      - name: Hub logs on failure
        if: failure()
        run: |
          echo "=== :3000 (service role)"; cat /tmp/hub.log || true
          echo "=== :3001 (minted hub tokens)"; cat /tmp/hub-token.log || true

  # --- The engine anywhere: plain Node, plain Postgres, no Supabase --------
  #
  # Architecture 5 (ADR-012, RUN-ANYWHERE.md): the hub on a plain `postgres:17`
  # container and a bare PostgREST, with no Supabase CLI and no Vercel. The
  # roles, the migrations and the seed go in through psql; supabase-js reaches
  # PostgREST through scripts/run-anywhere/rest-proxy.mjs (the /rest/v1 path);
  # every outside service is its in-memory fake, the object store included.
  # Then the unit suite, a fixture hub's /health, /.well-known/civic.json and
  # /events, and the API suite in service-role mode. Ports match the Supabase
  # CLI's (54321 for the API, 54322 for Postgres), so the tests' defaults hold.
  # The values here are this job's own and reach nothing outside the runner.
  run-anywhere:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          # ICU en-US, as on Supabase: text sorts the same (glibc's en_US
          # ignores punctuation, and a test pins the order).
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: "54322"
      PGUSER: postgres
      PGPASSWORD: postgres
      RA_JWT_SECRET: run-anywhere-ci-only-jwt-secret-0123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: npm 12
        run: npm install -g npm@12.2.0

      - name: Install
        run: npm ci --include=dev

      - name: Roles, every migration and the seed (psql)
        run: |
          psql -v ON_ERROR_STOP=1 -q -v authenticator_password=postgres -f scripts/run-anywhere/roles.sql
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f" || { echo "::error::migration failed: $f"; exit 1; }
          done
          psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          echo "$(ls supabase/migrations/*.sql | wc -l) migrations applied"

      - name: PostgREST, and /rest/v1 in front of it
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgres://authenticator:postgres@127.0.0.1:54322/postgres \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$RA_JWT_SECRET" -e PGRST_SERVER_PORT=3010 \
            postgrest/postgrest:v14.5
          node scripts/run-anywhere/rest-proxy.mjs 54321 http://127.0.0.1:3010 > /tmp/rest-proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:54321/rest/v1/ >/dev/null && break; sleep 1; done
          KEY=$(node scripts/run-anywhere/service-key.mjs "$RA_JWT_SECRET")
          echo "::add-mask::$KEY"
          echo "RA_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Seed hub settings and the jurisdiction list
        run: |
          npx tsx scripts/seed-hub-settings.ts --hub floyd
          npx tsx scripts/seed-hub-settings.ts --hub athens
          node --import tsx scripts/load-jurisdictions.ts
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RA_SERVICE_KEY }}
          CIVIC_ADMIN_EMAILS: admin@example.test
          CIVIC_TARGET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Unit tests
        run: npx vitest run tests/unit

      - name: Start the hub on plain Node
        run: |
          PORT=3000 BASE_URL=http://localhost:3000 node --import tsx src/index.ts > /tmp/hub.log 2>&1 &
          PORT=3001 BASE_URL=http://localhost:3001 node --import tsx src/index.ts > /tmp/hub-other.log 2>&1 &
          for port in 3000 3001; do
            ok=""
            for i in $(seq 1 30); do curl -sf http://localhost:$port/health >/dev/null && ok=1 && break; sleep 1; done
            [ -n "$ok" ] || { echo "hub on :$port did not come up:"; cat /tmp/hub.log /tmp/hub-other.log; exit 1; }
          done
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RA_SERVICE_KEY }}
          NODE_ENV: development
          CIVIC_ALLOW_SEED: "true"
          CIVIC_ADMIN_EMAILS: admin@example.test
          CIVIC_DEV_HUB: athens
          CIVIC_JURISDICTION: us-va-floyd
          CIVIC_CONSOLE_HOSTNAME: console.localhost
          CIVIC_CONSOLE_ADMIN_EMAIL: operator@example.test
          CIVIC_START_HOSTNAME: start.localhost
          CIVIC_ANON_SECRET: ci-only-anon-secret
          CRON_SECRET: ci-only-cron-secret
          DIGEST_UNSUBSCRIBE_SECRET: ci-only-digest-unsubscribe-secret
          CIVIC_FAKE_ADAPTERS: "on"
          CIVIC_OBJECT_STORE: memory
          CIVIC_DASHBOARD_FAKE: "on"

      - name: A fixture hub serves /health, its manifest and its events
        run: |
          H="Host: athens.localhost"
          curl -sf -H "$H" http://localhost:3000/health | tee /dev/stderr \
            | jq -e '.status == "ok" and .db.ok and .hub_db.ok and .schema.ok and (.schema.gaps | length == 0)' >/dev/null
          curl -sf -H "$H" http://localhost:3000/.well-known/civic.json | jq -e '.space and (.process_types | length) > 0' >/dev/null
          curl -sf -H "$H" "http://localhost:3000/events?limit=5&page=true" \
            | jq -e '.type == "OrderedCollectionPage" and (.orderedItems | length) > 0' >/dev/null

      - name: API tests (service role)
        run: npx vitest run tests/api
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.RA_SERVICE_KEY }}
          CIVIC_API_BASE: http://localhost:3000
          CIVIC_OTHER_API_BASE: http://localhost:3001
          CIVIC_EXPECT_HUB_DB_MODE: service_role
          CIVIC_TEST_DIGEST_SECRET: ci-only-digest-unsubscribe-secret
          CIVIC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          CIVIC_TARGET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # No object storage here (CIVIC_OBJECT_STORE=memory): the tests that
          # read Supabase Storage back skip themselves.
          CIVIC_TEST_OBJECT_STORE: memory
          # The tests that mint hub tokens sign them with PostgREST's secret.
          CIVIC_HUB_SIGNING_KEY: ${{ env.RA_JWT_SECRET }}

      - name: Logs on failure
        if: failure()
        run: |
          echo "=== hub"; cat /tmp/hub.log || true
          echo "=== hub (other)"; cat /tmp/hub-other.log || true
          echo "=== rest proxy"; cat /tmp/rest-proxy.log || true
          echo "=== postgrest"; docker logs postgrest || true

env:
  # The Supabase CLI's fixed local key. Public by design — it is printed by
  # `supabase start` on every machine and is scoped to the local container.
  LOCAL_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
