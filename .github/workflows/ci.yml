name: CI

# Typecheck + unit tests on every push and PR. This is the safety net the
# repo lacked: pushing to main auto-deploys to Vercel, and the backend is
# bundled by esbuild (no tsc) on deploy — so without this, a backend type
# error ships to production silently. CI does not gate the Vercel deploy
# (that's independent); it surfaces breakage fast.

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # --- Backend: install, typecheck (tsc), run infra-free unit tests ---
      # Use `npm install` (not `npm ci`): the dep tree includes optional,
      # platform-specific WASM bindings (@rolldown/@emnapi) that resolve to
      # different versions on Linux vs macOS, so a macOS-generated lockfile
      # fails `npm ci`'s cross-platform strictness. `npm install` tolerates it
      # and matches what Vercel runs on deploy.
      - name: Backend install
        run: npm install --include=dev
      - name: Backend typecheck
        run: npm run build
      # No string in src/ or ui/src/ may name a place: a place name is a hub's
      # data (its hubs row or hub_settings), never code. Comments are exempt;
      # anything else needs an entry with a reason in
      # scripts/place-name-allowlist.txt. Its own step, ahead of the tests, so
      # the failure says what it is. Added 2026-09-24 (multi-tenant Phase 4).
      - name: Place-name check
        run: npx tsx scripts/check-place-names.ts
      # Only src/db/, src/control/, scripts/ and tests/ may import the raw,
      # service-role database client, and each such file says why with a
      # `@civic-raw-client-importer:` tag (eslint.config.js). Everything else
      # reaches data through forHub(). Added 2026-09-24 (multi-tenant 2b).
      - name: Lint (raw-client rule)
        run: npm run lint
      - name: Backend unit tests
        # tests/unit only — tests/api and tests/e2e need a live Supabase/dev
        # server and are not runnable in CI. `npm test` would run everything.
        run: npx vitest run tests/unit

      # --- UI: install, real typecheck + build (tsc -b && vite build) ---
      - name: UI install
        run: npm install --include=dev
        working-directory: ui
      - name: UI build
        run: npm run build
        working-directory: ui

  # --- API integration tests against a real Supabase stack -----------------
  #
  # Added 2026-09-22. This layer existed since 2026-08 but had never run on
  # push: CI had no database, and a bare postgres container cannot stand in,
  # because the app talks exclusively through PostgREST. The Supabase CLI
  # brings up Postgres AND PostgREST and applies supabase/migrations from
  # empty, so this job also proves, on every push, that the migration set
  # builds a working schema from scratch — which was true by luck rather than
  # by check until the missing GRANTs were found this way.
  #
  # Separate job, not appended to the one above: it pulls container images and
  # takes minutes rather than seconds, and a failure here means something
  # different from a type error. The unit job stays the fast signal.
  #
  # Every step runs at the repository root. This workflow belongs to the
  # civic-hub repository, whose root IS civic-hub/ — until 2026-09-24 each
  # step said `working-directory: civic-hub`, the path as seen from the
  # monorepo, and the job failed in seconds on every push without ever
  # reaching a test.
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration, then supabase/seed.sql, which is where the
      # second hub (athens) comes from. The API tests assert that two
      # hostnames resolve to two different hubs, so the seed is not optional.
      - name: Start Supabase
        run: supabase start

      - name: Install
        run: npm install --include=dev

      # The keys below are the Supabase CLI's fixed local development keys.
      # They are public, identical on every machine, and reach nothing but the
      # container started above. No secret belongs in this job.
      - name: Seed hub settings
        run: |
          npx tsx scripts/seed-hub-settings.ts --hub floyd
          npx tsx scripts/seed-hub-settings.ts --hub athens
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SERVICE_ROLE_KEY }}
          # Athens's admin is derived from this by plus-addressing
          # (admin+athens@example.test), which is the address the login
          # hardening tests sign in as. Must match the hub step below.
          CIVIC_ADMIN_EMAILS: admin@example.test

      - name: Start the hub
        run: |
          node --import tsx src/index.ts > /tmp/hub.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && exit 0
            sleep 1
          done
          echo "hub did not become healthy:"; cat /tmp/hub.log; exit 1
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SERVICE_ROLE_KEY }}
          BASE_URL: http://localhost:3000
          PORT: "3000"
          NODE_ENV: development
          CIVIC_ALLOW_SEED: "true"
          CIVIC_ADMIN_EMAILS: admin@example.test
          # Bare localhost resolves to the DEMO hub. Floyd is seeded in beta,
          # mirroring production, so a test cannot sign in there without being
          # on the allowlist. Athens is the demo, which is where a test signs
          # in; the tests that care about Floyd set the Host header.
          CIVIC_DEV_HUB: athens
          CIVIC_ANON_SECRET: ci-only-anon-secret
          CRON_SECRET: ci-only-cron-secret

      - name: API tests
        run: npx vitest run tests/api

      - name: Hub log on failure
        if: failure()
        run: cat /tmp/hub.log || true

env:
  # The Supabase CLI's fixed local key. Public by design — it is printed by
  # `supabase start` on every machine and is scoped to the local container.
  LOCAL_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
